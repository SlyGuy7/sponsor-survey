name: Tests

# Runs on every push and pull request. GitHub Pages publishes the branch regardless of the result,
# so check the green tick (or the Actions tab) before sharing a new version of the survey.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is moving to Ubuntu 26, which the test browser install may not support yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      # Each check below runs even if an earlier one failed, so one run shows everything that is wrong.
      - name: Apps Script unit tests
        if: ${{ !cancelled() }}
        run: npm run test:script
      - name: Browser tests (survey, keyboard, accessibility, layout)
        if: ${{ !cancelled() }}
        run: npm run test:ui
      - name: Lighthouse scores
        if: ${{ !cancelled() }}
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npm run lighthouse

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
