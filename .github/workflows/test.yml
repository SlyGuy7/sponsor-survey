name: Tests

# Runs on every push and pull request. GitHub Pages publishes the branch regardless of the result,
# so check the green tick (or the Actions tab) before sharing a new version of the survey.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests (Apps Script) and browser tests
        run: npm test
      - name: Lighthouse scores
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
